<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <div class="site-container">
    <header>
      <h1><a href="{{ '/' | relative_url }}">Syed Haseeb Ahmed</a></h1>

      <!-- Navigation Tabs -->
      <nav class="site-tabs">
        <a href="{{ '/' | relative_url }}" class="tab-item {% if page.url == '/' or page.url == '/index.html' %}active{% endif %}">Home</a>
        <a href="{{ '/about/' | relative_url }}" class="tab-item {% if page.url contains '/about' %}active{% endif %}">About</a>
        <a href="{{ '/projects/' | relative_url }}" class="tab-item {% if page.url contains '/projects' %}active{% endif %}">Projects</a>
        <a href="{{ '/writing/' | relative_url }}" class="tab-item {% if page.url contains '/writing' %}active{% endif %}">Writing</a>
      </nav>
    </header>

    <main>
      {{ content }}
    </main>
  </div>

  <!-- Custom Footer -->
  <footer class="site-footer">
    <p>Where words meet actions -- breaking boundaries, building bridges, and crossing the oceans of irrelevance.</p>
  </footer>

</body>
</html>
